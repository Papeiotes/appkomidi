services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vardia
      POSTGRES_PASSWORD: vardia
      POSTGRES_DB: vardia
    ports:
      - "5432:5432"
    volumes:
      - vardia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vardia -d vardia"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Published host port, so the API reaches Postgres on Docker Desktop and on Linux.
      DATABASE_URL: postgresql://vardia:vardia@host.docker.internal:5432/vardia?schema=public
      JWT_SECRET: dev-vardia-change-me
      PORT: 4107
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      OSRM_URL: https://router.project-osrm.org
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Dimarcheio!2026
      ADMIN_NAME: Διαχειριστής
      MUNICIPALITY_NAME: Δήμος
      OVERFLOW_KG: 75
    ports:
      - "4107:4107"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4107
    ports:
      - "4108:4108"
    depends_on:
      - api

volumes:
  vardia_pg:
